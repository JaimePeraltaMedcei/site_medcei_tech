    <section class="day" id="um-dia" aria-labelledby="t-day" data-day>
      <div class="day__stage">
        <div class="day__sky" aria-hidden="true">
          <span class="day__sun" data-day-sun></span>
        </div>
        <div class="day__copy">
          <h2 class="section-title" id="t-day">Um dia na app</h2>
          <p class="day__lead">Desça a página e veja o que a família recebe ao longo de um dia, sem ter de ligar para a sua empresa.</p>
          <p class="day__clock" aria-live="off"><span data-day-clock>07:00</span></p>
          <p class="day__now" data-day-now>Bom dia</p>
          <div class="day__track" aria-hidden="true"><span data-day-progress></span></div>
        </div>
        <div class="day__device">
          <div class="phone phone--live">
            <div class="app">
              <div class="app__top">
                <p class="app__hello">Olá, Joana!</p>
                <p class="app__who">A acompanhar: Maria Ferreira, 86 anos</p>
              </div>
              <ol class="app__feed" data-day-feed></ol>
            </div>
          </div>
        </div>
      </div>
    </section>
